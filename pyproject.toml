# Folgt python-richtlinien 1.0.0
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-uploader"
version = "0.1.0"
description = "Wiederaufsetzbares Hochladen vieler und großer Dateien in einen S3-Bucket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Tesch" }]
requires-python = ">=3.11"
# Laufzeit-Abhängigkeiten stehen nur in requirements.txt (eine Quelle),
# Zusatzmodule für Entwicklung in requirements-dev.txt.
dynamic = ["dependencies"]

[project.urls]
Quellcode = "https://github.com/Weitenbummler/s3-uploader"

[project.scripts]
s3-uploader = "s3_uploader.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "D"]
# RUF001-003: deutsche Texte enthalten typografische Zeichen (–, „ “).
# N818: Ausnahmen enden auf „Fehler“ statt „Error“ (PY-S1).
ignore = ["D105", "D107", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["s3_uploader"]
known-local-folder = ["conftest"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"

# boto3/botocore liefern keine Typinformationen; boto3-stubs wäre eine weitere Abhängigkeit (PY-A1).
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Nur test_* sammeln – sonst hielte pytest die Fachfunktion teste_verbindung für einen Test.
python_functions = ["test_*"]
